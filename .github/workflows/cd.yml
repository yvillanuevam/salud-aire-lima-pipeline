name: CD

# Al mergear a main: se vuelve a correr el CI sobre el commit final (ultimo
# candado) y, solo si pasa, se construye y publica la imagen de Airflow del
# proyecto en GitHub Container Registry, versionada con el SHA del commit.
# Un servidor de Airflow (o un cluster) despliega exactamente esa imagen.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publicar-imagen:
    needs: ci   # CD solo corre si el CI termino en verde
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: produccion
    permissions:
      contents: read
      packages: write   # el GITHUB_TOKEN automatico basta: no hay secretos propios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Metadatos de la imagen (nombre en minusculas y tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/salud-aire-airflow
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Resumen del despliegue
        run: |
          echo "### Imagen publicada" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
